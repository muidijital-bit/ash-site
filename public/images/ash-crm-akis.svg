<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="CRM-X ilk temastan sadakate">
  <title>CRM-X — müşteri kaydı tek yerde, fırsat aşamaları ve bekleyen takip tek ekranda</title>
  <defs>
    <linearGradient id="cx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset=".55" stop-color="#7448e8"/>
      <stop offset="1" stop-color="#d946b5"/>
    </linearGradient>
    <filter id="cxg" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      /* Hareketi azaltmayi tercih edenlerde akan nokta gizlenir. */
      @media (prefers-reduced-motion: reduce) { .akis { display: none } }
    </style>
  </defs>

  <!-- pasif temaslar -->
  <g fill="none" stroke="#b9c1d8" stroke-width="7" stroke-linecap="round">
    <path d="M214 200 C 262 200, 272 120, 330 120"/>
    <path d="M214 200 C 262 200, 272 280, 330 280"/>
  </g>

  <!-- aktif firsat -->
  <path d="M214 200 L 330 200" fill="none" stroke="url(#cx)" stroke-width="26" opacity=".3" filter="url(#cxg)"/>
  <path d="M214 200 L 330 200" fill="none" stroke="url(#cx)" stroke-width="9" stroke-linecap="round"/>
  <circle class="akis" r="9" fill="#7448e8">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M214 200 L 330 200"/>
  </circle>

  <!-- musteri karti -->
  <rect x="40" y="140" width="174" height="120" rx="26" fill="#0a143d"/>
  <circle cx="82" cy="180" r="18" fill="url(#cx)"/>
  <rect x="112" y="172" width="72" height="12" rx="6" fill="#f8f8f6" opacity=".92"/>
  <rect x="112" y="192" width="48" height="9" rx="4.5" fill="#f8f8f6" opacity=".45"/>
  <rect x="68" y="222" width="118" height="10" rx="5" fill="#f8f8f6" opacity=".3"/>
  <rect x="68" y="240" width="86" height="10" rx="5" fill="#f8f8f6" opacity=".3"/>

  <!-- firsat hunisi: asamalar daralarak iner -->
  <g>
    <rect x="330" y="46" width="270" height="52" rx="18" fill="#eef0f7" stroke="#b9c1d8" stroke-width="3"/>
    <rect x="356" y="66" width="104" height="11" rx="5.5" fill="#8b94b3"/>
    <rect x="540" y="66" width="34" height="11" rx="5.5" fill="#b9c1d8"/>

    <rect x="352" y="110" width="226" height="52" rx="18" fill="#eef0f7" stroke="#b9c1d8" stroke-width="3"/>
    <rect x="378" y="130" width="88" height="11" rx="5.5" fill="#8b94b3"/>
    <rect x="518" y="130" width="34" height="11" rx="5.5" fill="#b9c1d8"/>

    <!-- aktif asama -->
    <rect x="374" y="174" width="182" height="52" rx="18" fill="#ffffff" stroke="url(#cx)" stroke-width="5"/>
    <rect x="400" y="194" width="76" height="12" rx="6" fill="#0a143d"/>
    <circle cx="530" cy="200" r="9" fill="url(#cx)"/>

    <rect x="396" y="238" width="138" height="52" rx="18" fill="#eef0f7" stroke="#b9c1d8" stroke-width="3"/>
    <rect x="422" y="258" width="62" height="11" rx="5.5" fill="#8b94b3"/>

    <rect x="418" y="302" width="94" height="52" rx="18" fill="#eef0f7" stroke="#b9c1d8" stroke-width="3"/>
    <rect x="444" y="322" width="42" height="11" rx="5.5" fill="#8b94b3"/>
  </g>
</svg>
