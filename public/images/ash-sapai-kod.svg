<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="SAPAI-X talepten onaylı geliştirmeye">
  <title>SAPAI-X — talep analiz edilir, sisteme özgü ABAP geliştirmesi onayınıza hazırlanır</title>
  <defs>
    <linearGradient id="sx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset=".55" stop-color="#7448e8"/>
      <stop offset="1" stop-color="#d946b5"/>
    </linearGradient>
    <filter id="sxg" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="sxc"><rect x="330" y="40" width="270" height="320" rx="24"/></clipPath>
    <style>
      /* Hareketi azaltmayi tercih edenlerde akan nokta gizlenir. */
      @media (prefers-reduced-motion: reduce) { .akis { display: none } }
    </style>
  </defs>

  <!-- pasif talepler -->
  <g fill="none" stroke="#b9c1d8" stroke-width="7" stroke-linecap="round">
    <path d="M214 200 C 262 200, 272 104, 330 104"/>
    <path d="M214 200 C 262 200, 272 296, 330 296"/>
  </g>

  <!-- aktif talep -->
  <path d="M214 200 L 330 200" fill="none" stroke="url(#sx)" stroke-width="26" opacity=".3" filter="url(#sxg)"/>
  <path d="M214 200 L 330 200" fill="none" stroke="url(#sx)" stroke-width="9" stroke-linecap="round"/>
  <circle class="akis" r="9" fill="#7448e8">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M214 200 L 330 200"/>
  </circle>

  <!-- talep kutusu -->
  <rect x="40" y="152" width="174" height="96" rx="26" fill="#0a143d"/>
  <rect x="72" y="182" width="110" height="12" rx="6" fill="#f8f8f6" opacity=".92"/>
  <rect x="72" y="208" width="72" height="10" rx="5" fill="#f8f8f6" opacity=".45"/>

  <!-- kod paneli -->
  <rect x="330" y="40" width="270" height="320" rx="24" fill="#ffffff" stroke="url(#sx)" stroke-width="5"/>
  <g clip-path="url(#sxc)">
    <rect x="330" y="40" width="270" height="46" fill="#0a143d"/>
    <rect x="356" y="57" width="104" height="12" rx="6" fill="#f8f8f6" opacity=".8"/>
  </g>
  <!-- satir numaralari -->
  <g fill="#b9c1d8">
    <rect x="352" y="112" width="12" height="9" rx="4.5"/>
    <rect x="352" y="142" width="12" height="9" rx="4.5"/>
    <rect x="352" y="172" width="12" height="9" rx="4.5"/>
    <rect x="352" y="202" width="12" height="9" rx="4.5"/>
    <rect x="352" y="232" width="12" height="9" rx="4.5"/>
  </g>
  <!-- kod satirlari -->
  <rect x="380" y="112" width="58" height="9" rx="4.5" fill="#7448e8"/>
  <rect x="446" y="112" width="86" height="9" rx="4.5" fill="#8b94b3"/>
  <rect x="392" y="142" width="46" height="9" rx="4.5" fill="#2f6bff"/>
  <rect x="446" y="142" width="112" height="9" rx="4.5" fill="#8b94b3"/>
  <rect x="392" y="172" width="70" height="9" rx="4.5" fill="#d946b5"/>
  <rect x="470" y="172" width="54" height="9" rx="4.5" fill="#8b94b3"/>
  <rect x="380" y="202" width="42" height="9" rx="4.5" fill="#7448e8"/>
  <rect x="430" y="202" width="96" height="9" rx="4.5" fill="#8b94b3"/>
  <rect x="380" y="232" width="74" height="9" rx="4.5" fill="#8b94b3" opacity=".6"/>

  <!-- onay seridi -->
  <rect x="352" y="272" width="226" height="64" rx="18" fill="#eef0f7"/>
  <circle cx="386" cy="304" r="18" fill="url(#sx)"/>
  <path d="M378 304 l6 7 12 -14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="418" y="291" width="104" height="11" rx="5.5" fill="#0a143d"/>
  <rect x="418" y="310" width="68" height="9" rx="4.5" fill="#8b94b3"/>
</svg>
